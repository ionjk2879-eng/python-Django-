<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}게시판{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --brand: #4f46e5;
            --brand-dark: #4338ca;
            --bg: #f5f6fa;
            --card-border: #e9eaf0;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            color: #24262d;
        }
        a { color: var(--brand); text-decoration: none; }
        a:hover { color: var(--brand-dark); text-decoration: underline; }

        .navbar {
            background-color: #fff !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--brand) !important;
            letter-spacing: -0.02em;
        }

        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand);
        }
        .btn-primary:hover {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
        }
        .btn-outline-primary {
            color: var(--brand);
            border-color: var(--brand);
        }
        .btn-outline-primary:hover {
            background-color: var(--brand);
            border-color: var(--brand);
        }

        .card-box {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
            padding: 1.75rem;
        }

        .page-title {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        table thead {
            background-color: #f9fafc;
        }
        table th {
            font-weight: 600;
            color: #555;
        }

        .pagination .page-link {
            color: var(--brand);
        }
        .pagination .page-item.active .page-link {
            background-color: var(--brand);
            border-color: var(--brand);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'board:post_list' %}">게시판</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a class="me-2" href="{% url 'accounts:mypage' %}">{{ user.username }}님</a>
                <form class="d-inline" method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link p-0">로그아웃</button>
                </form>
            {% else %}
                <a class="me-2" href="{% url 'accounts:login' %}">로그인</a>
                <a href="{% url 'accounts:signup' %}">회원가입</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
