{% extends 'base.html' %}
{% load widget_tweaks %}
{% block title %}로그인{% endblock %}
{% block content %}
    <div class="card-box mx-auto" style="max-width: 380px;">
        <h1 class="h4 page-title mb-3 text-center">로그인</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">아이디</label>
                {{ form.username|add_class:'form-control' }}
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">비밀번호</label>
                {{ form.password|add_class:'form-control' }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">로그인</button>
            <a class="btn btn-link w-100" href="{% url 'accounts:signup' %}">회원가입</a>
        </form>
    </div>
{% endblock %}
