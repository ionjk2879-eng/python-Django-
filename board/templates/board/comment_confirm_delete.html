{% extends 'base.html' %}{% block title %}댓글 삭제{% endblock %}{% block content %}<section class="mx-auto max-w-lg px-4 py-16"><div class="card p-8 text-center"><span class="text-4xl">💬</span><h1 class="mt-4 text-2xl font-bold text-coffee-900">이 의견을 삭제할까요?</h1><p class="mt-2 text-sm text-stone-500">삭제한 의견은 다시 복구할 수 없습니다.</p><form class="mt-7 flex justify-center gap-3" method="post">{% csrf_token %}<button class="btn-danger" type="submit">삭제하기</button><a class="btn-secondary" href="{% url 'board:post_detail' comment.post_id %}">돌아가기</a></form></div></section>{% endblock %}
