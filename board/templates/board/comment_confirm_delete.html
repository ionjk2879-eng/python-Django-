{% extends 'base.html' %}
{% block title %}댓글 삭제{% endblock %}
{% block content %}
    <h1 class="h4 page-title mb-3">댓글 삭제</h1>
    <div class="card-box" style="max-width: 480px;">
        <p>"{{ comment.content }}" 댓글을 삭제하시겠습니까?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">삭제</button>
            <a class="btn btn-secondary" href="{% url 'board:post_detail' comment.post_id %}">취소</a>
        </form>
    </div>
{% endblock %}
