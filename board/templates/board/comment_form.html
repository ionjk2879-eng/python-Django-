{% extends 'base.html' %}
{% load widget_tweaks %}
{% block title %}댓글 작성{% endblock %}
{% block content %}
    <h1 class="h4 page-title mb-3">댓글 {% if comment %}수정{% else %}작성{% endif %}</h1>
    <div class="card-box" style="max-width: 480px;">
        <form method="post">
            {% csrf_token %}
            {{ form.content|add_class:'form-control' }}
            <button type="submit" class="btn btn-primary mt-2">저장</button>
        </form>
    </div>
{% endblock %}
