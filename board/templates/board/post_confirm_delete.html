{% extends 'base.html' %}{% block title %}게시글 삭제{% endblock %}{% block content %}<section class="mx-auto max-w-lg px-4 py-16"><div class="card p-8 text-center"><span class="text-4xl">🗑️</span><h1 class="mt-4 text-2xl font-bold text-coffee-900">이 기록을 삭제할까요?</h1><p class="mt-2 text-sm text-stone-500">“{{ object.title }}” 기록은 삭제 후 되돌릴 수 없습니다.</p><form class="mt-7 flex justify-center gap-3" method="post">{% csrf_token %}<button class="btn-danger" type="submit">삭제하기</button><a class="btn-secondary" href="{% url 'board:post_detail' object.pk %}">돌아가기</a></form></div></section>{% endblock %}
